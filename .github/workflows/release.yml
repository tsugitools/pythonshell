name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder's appx target writes .appx; the formats are the same.
      - name: Rename AppX to MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem dist -Filter *.appx | Rename-Item -NewName { $_.BaseName + '.msix' }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.msix
            desktop/dist/*.AppImage
            desktop/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mas:
    name: Mac App Store
    runs-on: macos-latest
    if: ${{ secrets.MAC_CSC_LINK != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Provisioning profile
        if: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 != '' }}
        run: echo "${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}" | base64 --decode > build/embedded.provisionprofile

      - name: Build Mac App Store package
        run: npm run dist:mas
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAC_CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_CSC_INSTALLER_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: mas-pkg
          path: |
            desktop/dist/*.pkg
            desktop/dist/mas/*.pkg
